services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apsit-notifier
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "main.py"]

  mongodb:
    image: mongo:latest
    container_name: apsit-notifier-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app_venv:
  mongo_data:
